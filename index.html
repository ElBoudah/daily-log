<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111417">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#111417; --card:#1a1e23; --card2:#242a31; --line:#2a2f35; --line2:#343b44;
    --txt:#e8e6e1; --mut:#9ca3af; --dim:#6b7280; --faint:#4b5563;
    --teal:#7fb7a3; --blue:#8ab4d8; --amber:#e09f3e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);}
  .wrap{max-width:430px; margin:0 auto; padding:22px 16px 64px;}
  h1{font-size:22px; font-weight:600; letter-spacing:-.02em; margin:0;}
  .mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;}
  .sub{font-size:12px; color:var(--dim); margin:4px 0 18px;}
  .hdr{display:flex; justify-content:space-between; align-items:baseline;}
  #saved{font-size:11px; color:transparent; transition:color .3s;}
  #saved.on{color:var(--teal);}
  .urgent{width:100%; border-radius:12px; padding:13px; margin-bottom:18px; font-size:14px; font-weight:500;
    background:rgba(224,159,62,.10); border:1px solid var(--amber); color:var(--amber); cursor:pointer;}
  .tabs{display:flex; gap:4px; padding:4px; border-radius:12px; background:#16191d; margin-bottom:18px;}
  .tabs button{flex:1; padding:9px 0; border-radius:9px; font-size:14px; border:1px solid transparent;
    background:transparent; color:var(--dim); cursor:pointer;}
  .tabs button.on{background:var(--card2); color:var(--txt); border-color:var(--line2);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
  .label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:14px 0 8px;}
  .check{width:100%; display:flex; justify-content:space-between; align-items:center; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 16px;
    color:var(--txt); font-size:14px; margin-bottom:8px; cursor:pointer;}
  .check.on{background:rgba(127,183,163,.12); border-color:var(--teal);}
  .check .box{width:24px; height:24px; min-width:24px; margin-left:12px; border-radius:50%;
    border:1.5px solid var(--faint); display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; color:var(--bg);}
  .check.on .box{background:var(--teal); border-color:var(--teal);}
  .srow{display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;}

  /* curseurs : la zone tactile doit rester large, et le glissement ne doit jamais être interrompu */
  .slidewrap{padding:6px 0 2px; touch-action:pan-y;}
  input[type=range]{width:100%; height:4px; background:var(--line); border-radius:2px;
    -webkit-appearance:none; appearance:none; margin:0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;
    width:26px; height:26px; border-radius:50%; cursor:pointer; border:none;}
  input[type=range]::-moz-range-thumb{width:26px; height:26px; border-radius:50%; cursor:pointer; border:none;}
  .r-teal::-webkit-slider-thumb{background:var(--teal);} .r-teal::-moz-range-thumb{background:var(--teal);}
  .r-blue::-webkit-slider-thumb{background:var(--blue);} .r-blue::-moz-range-thumb{background:var(--blue);}
  .r-amber::-webkit-slider-thumb{background:var(--amber);} .r-amber::-moz-range-thumb{background:var(--amber);}

  /* heures de sommeil */
  .timerow{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tf{display:flex; flex-direction:column; gap:5px;}
  .tl{font-size:11.5px; color:var(--dim);}
  input[type=time]{background:var(--card2); border:1px solid var(--line2); color:var(--txt);
    border-radius:9px; padding:11px 10px; font-size:17px; width:100%;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;}
  input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.6);}

  .daynav{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .daynav button{background:var(--card); border:1px solid var(--line); color:var(--mut);
    border-radius:9px; padding:5px 14px; font-size:15px; cursor:pointer;}
  .daynav button:disabled{color:#374151;}
  .daynav span{font-size:14px; text-transform:capitalize;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .big{font-size:22px; margin:2px 0;}
  .tiny{font-size:11px; color:var(--dim);}
  .btn{width:100%; border-radius:12px; padding:13px; font-size:14px; font-weight:500; border:none; cursor:pointer;}
  .btn-teal{background:var(--teal); color:var(--bg);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--dim);}
  .btn-outline-teal{background:rgba(127,183,163,.10); border:1px solid var(--teal); color:var(--teal);}
  .btn-outline-grey{background:var(--card); border:1px solid var(--faint); color:#d1d5db;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
  .chips button{padding:8px 12px; border-radius:9px; font-size:13px; cursor:pointer;
    background:var(--card2); border:1px solid var(--line2); color:var(--mut);}
  .chips button.on{background:rgba(138,180,216,.15); border-color:var(--blue); color:var(--blue);}
  .chips.pick button{flex:1; padding:11px 0; text-align:center;}
  .chips.pick button.on{background:rgba(127,183,163,.15); border-color:var(--teal); color:var(--teal);}
  .chips.pick{flex-wrap:nowrap; gap:6px; margin:10px 0 0;}
  .msg{background:rgba(127,183,163,.10); border:1px solid var(--teal); color:#cfe8de;
    border-radius:12px; padding:13px 16px; font-size:14px; margin-bottom:12px;}
  ol{margin:6px 0 0; padding-left:2px; list-style:none; color:var(--mut); font-size:13.5px;}
  ol li{margin-bottom:4px;}
  .note{font-size:12px; color:var(--faint); line-height:1.5; margin-top:6px;}
  .spark{width:100%; height:56px; display:block;}
  .rowbtns{display:flex; gap:10px;}
  .link{display:block; text-align:center; font-size:13px; color:var(--dim); text-decoration:none; padding:12px 0 0;}
  input[type=file]{display:none;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr"><h1>Suivi</h1><span id="saved" class="mono">enregistré</span></div>
  <p class="sub">30 secondes par jour. Les données décident, pas l'humeur du moment.</p>

  <button class="urgent" onclick="go('pulsion')">Envie forte maintenant → protocole 10 min</button>

  <div class="tabs">
    <button id="tb-jour" onclick="go('jour')">Ce soir</button>
    <button id="tb-pulsion" onclick="go('pulsion')">Pulsion</button>
    <button id="tb-donnees" onclick="go('donnees')">Données</button>
  </div>

  <div id="msg" class="msg hidden"></div>
  <div id="view"></div>
</div>

<script>
// ---------- État ----------
const KEY = "suivi_v1";
let S = load();
let tab = "jour";
let selDay = today();
let urgeType = null, urgeTrig = null;
let saveTimer = null;

const EMPTY = { bed:null, wake:null, cardioMin:null, focusMin:null, clarity:null, mood:null, urge:null };
// "cardio" et "focus" sont les anciens champs booléens : encore lus pour détecter
// un jour rempli, plus jamais écrits.
const FIELDS = ["bed","wake","cardioMin","focusMin","clarity","mood","urge","cardio","focus","sleep"];
// Seuils de référence, utilisés pour compter des séances — jamais pour juger une journée.
const CARDIO_MIN = 30, FOCUS_MIN = 10;

function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return {days:{}, events:[]};
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    const el = document.getElementById("saved");
    el.classList.add("on"); setTimeout(()=>el.classList.remove("on"), 1400);
  }catch(e){ alert("Échec de sauvegarde — exporte tes données en JSON par sécurité."); }
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }

// ---------- Dates ----------
function today(){ return keyOf(new Date()); }
function keyOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addD(k,n){ const [y,m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return keyOf(dt); }
function frLong(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}); }
function frShort(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}); }
function diff(k1,k2){ const [a,b,c]=k1.split("-").map(Number), [x,y,z]=k2.split("-").map(Number);
  return Math.round((new Date(x,y-1,z)-new Date(a,b-1,c))/864e5); }

// ---------- Sommeil ----------
function toMin(t){ if(!t) return null; const [h,m]=t.split(":").map(Number);
  if(!isFinite(h)||!isFinite(m)) return null; return h*60+m; }
// Durée : (lever - coucher) modulo 24 h, ce qui gère le passage de minuit sans cas particulier.
function durMin(d){ const b=toMin(d.bed), w=toMin(d.wake); if(b===null||w===null) return null; return (w-b+1440)%1440; }
// Pour l'écart-type du coucher : on recentre l'échelle sur 18 h, sinon 23 h 50 et 00 h 10
// seraient à 23 h d'écart au lieu de 20 min.
function bedShift(t){ const b=toMin(t); return b===null ? null : (b-1080+1440)%1440; }
function hm(mins){ if(mins===null) return "—"; return Math.floor(mins/60)+" h "+String(mins%60).padStart(2,"0"); }
function sd(a){ if(a.length<2) return null; const m=a.reduce((x,y)=>x+y,0)/a.length;
  return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/(a.length-1)); }

// ---------- Stats ----------
function stats(win){
  const t = today(), keys = [];
  for(let i=win-1;i>=0;i--) keys.push(addD(t,-i));
  let logged=0, nights=0, cardioSess=0, focusSess=0, cardioVol=0, focusVol=0;
  const cl=[], mo=[], ur=[], durs=[], beds=[];
  keys.forEach(k=>{
    const d=S.days[k]; if(!d) return;
    const touched=FIELDS.some(f=>d[f]!==null&&d[f]!==undefined);
    if(!touched) return;
    logged++;
    if(typeof d.cardioMin==="number"){ cardioVol+=d.cardioMin; if(d.cardioMin>=CARDIO_MIN) cardioSess++; }
    if(typeof d.focusMin==="number"){ focusVol+=d.focusMin; if(d.focusMin>=FOCUS_MIN) focusSess++; }
    const du=durMin(d); if(du!==null){ nights++; durs.push(du); }
    const bs=bedShift(d.bed); if(bs!==null) beds.push(bs);
    if(d.clarity!=null)cl.push(d.clarity); if(d.mood!=null)mo.push(d.mood); if(d.urge!=null)ur.push(d.urge);
  });
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const rel=S.events.filter(e=>e.type==="rechute").map(e=>e.day).sort();
  let cur=null, avg=null;
  if(rel.length){
    cur=diff(rel[rel.length-1],t);
    if(rel.length>=2){ const g=[]; for(let i=1;i<rel.length;i++) g.push(diff(rel[i-1],rel[i])); avg=mean(g); }
  }
  return {keys,logged,nights,cardioSess,focusSess,cardioVol,focusVol,
    durAvg:mean(durs), bedSD:sd(beds),
    clA:mean(cl),moA:mean(mo),urA:mean(ur),cur,avg};
}
const fmt = v => v==null ? "—" : (Math.round(v*10)/10).toString().replace(".",",");

function bilan(){
  const s=stats(7), t=today();
  const ev=S.events.filter(e=>diff(e.day,t)<=6 && diff(e.day,t)>=0);
  const re=ev.filter(e=>e.type==="rechute"), rs=ev.filter(e=>e.type==="resistee");
  const tg=a=>a.length?" ("+a.map(e=>e.trigger.toLowerCase()).join(", ")+")":"";
  return [
    "SUIVI "+frShort(addD(t,-6))+" → "+frShort(t),
    "Jours loggés : "+s.logged+"/7",
    "Cardio : "+s.cardioSess+" séance(s) ≥30 min · "+s.cardioVol+" min au total",
    "Lecture/médit. : "+s.focusSess+" séance(s) ≥10 min · "+s.focusVol+" min au total",
    "Sommeil : "+s.nights+" nuits · durée moy. "+hm(s.durAvg===null?null:Math.round(s.durAvg))+
      " · régularité du coucher "+(s.bedSD===null?"—":"±"+Math.round(s.bedSD)+" min"),
    "Clarté moy. "+fmt(s.clA)+"/10 · Humeur moy. "+fmt(s.moA)+"/10 · Pulsion moy. "+fmt(s.urA)+"/10",
    "Événements 7 j : "+rs.length+" envie(s) passée(s)"+tg(rs)+" · "+re.length+" rechute(s)"+tg(re),
    "Intervalle courant : "+(s.cur==null?"—":s.cur+" j")+(s.avg!=null?" · moyenne : "+fmt(s.avg)+" j":"")
  ].join("\n");
}

// ---------- Sparkline ----------
function spark(field,color){
  const s=stats(14), w=280, h=56, p=6;
  const x=i=>p+i/(s.keys.length-1)*(w-2*p), y=v=>h-p-(v/10)*(h-2*p);
  let path="", prevNull=true, dots="", any=false;
  s.keys.forEach((k,i)=>{
    const d=S.days[k]; const v=d&&d[field]!=null?d[field]:null;
    if(v===null){prevNull=true;return;}
    any=true;
    path+=(prevNull?"M":"L")+x(i).toFixed(1)+" "+y(v).toFixed(1)+" ";
    dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="2.4" fill="'+color+'"/>';
    prevNull=false;
  });
  if(!any) return '<div style="height:56px;display:flex;align-items:center;font-size:12px;color:var(--dim)">pas encore de données</div>';
  let grid=""; [0,5,10].forEach(g=>{grid+='<line x1="'+p+'" x2="'+(w-p)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="#2a2f35" stroke-width="1"/>';});
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'">'+grid+'<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>';
}

// ---------- Rendu ----------
function go(t){ tab=t; urgeType=null; urgeTrig=null; render(); }
function flash(txt){
  const m=document.getElementById("msg");
  m.textContent=txt; m.classList.remove("hidden");
  setTimeout(()=>m.classList.add("hidden"), 6000);
}
function render(){
  ["jour","pulsion","donnees"].forEach(t=>{
    document.getElementById("tb-"+t).classList.toggle("on", tab===t);
  });
  const v=document.getElementById("view");
  if(tab==="jour") v.innerHTML=viewJour();
  else if(tab==="pulsion") v.innerHTML=viewPulsion();
  else v.innerHTML=viewDonnees();
}

function dayGet(){ return Object.assign({}, EMPTY, S.days[selDay]||{}); }

// setField : redessine seulement quand c'est nécessaire.
// Un re-rendu pendant un glissement détruirait l'élément en cours de manipulation
// et couperait le geste — c'était le bug des curseurs.
function setField(f, val, doRender){
  S.days[selDay] = Object.assign({}, EMPTY, S.days[selDay]||{});
  S.days[selDay][f] = val;
  if(doRender){ save(); render(); } else { saveSoon(); }
}
function toggle(f){ const d=dayGet(); setField(f, d[f]===true?false:true, true); } // conservé pour compat, plus utilisé
function slide(f, el){
  const v = Number(el.value);
  setField(f, v, false);
  const o = document.getElementById("out-"+f);
  if(o) o.textContent = v;
}
function setTime(f, el){
  setField(f, el.value || null, false);
  const o = document.getElementById("out-dur");
  if(o) o.textContent = hm(durMin(dayGet()));
}
function nav(n){ const nx=addD(selDay,n); if(nx<=today()) {selDay=nx; render();} }

// Durées : la valeur est une quantité, pas un verdict. Un tap comme avant,
// mais 20 min de cardio s'enregistrent comme 20 min et non comme un échec.
const PRESETS = { cardioMin:[0,15,30,45,60], focusMin:[0,5,10,20,30] };
function setDur(f, v){ setField(f, v, true); }
function askDur(f){
  const cur = dayGet()[f];
  const r = prompt("Durée en minutes ?", cur==null ? "" : String(cur));
  if(r===null) return;
  const n = parseInt(r,10);
  if(isFinite(n) && n>=0 && n<=600) setDur(f, n);
}
function durHtml(f, label){
  const d=dayGet(); const v=d[f];
  const isPreset = PRESETS[f].indexOf(v) !== -1;
  let chips = '<div class="chips pick">';
  PRESETS[f].forEach(p=>{
    chips += '<button class="'+(v===p?"on":"")+'" onclick="setDur(\''+f+'\','+p+')">'+p+'</button>';
  });
  chips += '<button class="'+(v!=null&&!isPreset?"on":"")+'" onclick="askDur(\''+f+'\')">…</button></div>';
  return '<div class="card"><div class="srow" style="margin-bottom:0"><span>'+label+'</span>'+
    '<span class="mono" style="color:'+(v?"var(--teal)":"var(--dim)")+'">'+(v==null?"—":v+" min")+'</span></div>'+
    chips+'</div>';
}
function sliderHtml(f,label,cls,color){
  const d=dayGet(); const v=d[f];
  return '<div class="card"><div class="srow"><span>'+label+'</span>'+
    '<span class="mono" id="out-'+f+'" style="color:'+color+'">'+(v==null?"—":v)+'</span></div>'+
    '<div class="slidewrap"><input type="range" class="'+cls+'" min="0" max="10" step="1" '+
    'value="'+(v==null?5:v)+'" oninput="slide(\''+f+'\', this)"></div></div>';
}
function sleepHtml(){
  const d=dayGet();
  return '<div class="card"><div class="timerow">'+
    '<div class="tf"><span class="tl">Coucher (hier soir)</span>'+
    '<input type="time" value="'+(d.bed||"")+'" onchange="setTime(\'bed\', this)"></div>'+
    '<div class="tf"><span class="tl">Lever (ce matin)</span>'+
    '<input type="time" value="'+(d.wake||"")+'" onchange="setTime(\'wake\', this)"></div>'+
    '</div><div class="srow" style="margin:12px 0 0"><span class="tiny">Durée</span>'+
    '<span class="mono" id="out-dur">'+hm(durMin(d))+'</span></div></div>';
}

function viewJour(){
  return '<div class="daynav">'+
    '<button onclick="nav(-1)">‹</button><span>'+frLong(selDay)+'</span>'+
    '<button onclick="nav(1)" '+(selDay>=today()?"disabled":"")+'>›</button></div>'+
    '<div class="label">Sommeil</div>'+ sleepHtml()+
    '<div class="label">Non-négociables</div>'+
    durHtml("cardioMin","Cardio")+
    durHtml("focusMin","Lecture ou méditation")+
    '<div class="label">État du jour</div>'+
    sliderHtml("clarity","Clarté mentale","r-teal","var(--teal)")+
    sliderHtml("mood","Humeur","r-blue","var(--blue)")+
    sliderHtml("urge","Pression de l\u2019envie (moyenne du jour)","r-amber","var(--amber)");
}

const TRIGGERS=["Fatigue","Ennui","Seul le soir","Stress / conflit","Sans raison claire","Autre"];
function pickType(t){ urgeType=t; render(); }
function pickTrig(i){ urgeTrig=TRIGGERS[i]; render(); }
function logEvent(){
  if(!urgeType||!urgeTrig) return;
  S.events.push({id:Date.now(), day:today(), ts:new Date().toISOString(), type:urgeType, trigger:urgeTrig});
  save();
  const t=urgeType; urgeType=null; urgeTrig=null; render();
  flash(t==="rechute"
    ? "Enregistré comme donnée. Pas de procès. Prochaine action : protéger le sommeil de ce soir — coucher à l'heure prévue, téléphone hors chambre."
    : "Enregistré. Une envie passée est une répétition réussie.");
}

function viewPulsion(){
  let h='<div class="card"><div style="font-size:14px;font-weight:500;margin-bottom:6px">Protocole 10 minutes</div><ol>'+
    '<li>1. Pas d\u2019interdiction : tu décides dans 10 min, pas maintenant.</li>'+
    '<li>2. Une action physique tout de suite : sortir marcher, pompes, douche, atelier.</li>'+
    '<li>3. Après 10 min, tu logges le résultat ici. Dans les deux cas, c\u2019est une donnée.</li></ol></div>';
  if(urgeType===null){
    h+='<div class="grid2">'+
      '<button class="btn btn-outline-teal" style="padding:16px 0" onclick="pickType(\'resistee\')">Envie passée</button>'+
      '<button class="btn btn-outline-grey" style="padding:16px 0" onclick="pickType(\'rechute\')">Rechute</button></div>';
  }else{
    h+='<div class="card"><div style="font-size:13.5px;color:var(--mut)">Déclencheur principal ?</div><div class="chips">';
    TRIGGERS.forEach((t,i)=>{ h+='<button class="'+(urgeTrig===t?"on":"")+'" onclick="pickTrig('+i+')">'+t+'</button>'; });
    h+='</div><div class="rowbtns">'+
      '<button class="btn btn-teal" style="flex:1;opacity:'+(urgeTrig?1:.4)+'" onclick="logEvent()">Enregistrer</button>'+
      '<button class="btn btn-ghost" style="width:auto;padding:13px 18px" onclick="pickType(null)">Annuler</button></div></div>';
  }
  h+='<p class="note">La métrique n\u2019est pas zéro rechute. C\u2019est l\u2019allongement des intervalles et un crash post-rechute plus court. Une rechute loggée avec son déclencheur vaut plus qu\u2019une semaine parfaite sans données.</p>';
  return h;
}

function copyBilan(){
  const txt=bilan();
  const done=()=>{ const b=document.getElementById("cpb"); if(b){b.textContent="Copié — colle-le dans le chat Claude"; setTimeout(()=>{b.textContent="Copier le bilan hebdo";},2000);} };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>{fallbackCopy(txt);done();}); }
  else{ fallbackCopy(txt); done(); }
}
function fallbackCopy(t){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }

function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="suivi-backup-"+today()+".json"; a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(d&&d.days&&d.events){ S=d; save(); render(); flash("Données importées."); }
      else flash("Fichier invalide.");
    }catch(e){ flash("Fichier invalide."); } };
  r.readAsText(f); input.value="";
}

    '<div class="card"><div class="tiny">7 derniers jours</div><div class="big mono">'+s.logged+'/7</div><div class="tiny">jours loggés</div></div></div>'+
    '<div class="card"><div class="tiny">Sommeil 7 j — '+s.nights+' nuit'+(s.nights>1?"s":"")+' renseignée'+(s.nights>1?"s":"")+'</div>'+
    '<div class="mono" style="font-size:15px;margin-top:4px">durée moy. '+hm(s.durAvg===null?null:Math.round(s.durAvg))+

    '<a class="link" href="tests.html">Tests cognitifs ›</a>'+

render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
